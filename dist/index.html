<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#161714">
  <meta name="description" content="スクロールで建築のレイヤーを抜け、中庭へ。短い空間の旅。">
  <title>INWARD — A study in depth</title>
  <link rel="icon" href="data:,">
  <link rel="preload" as="image" href="assets/courtyard.webp">
  <link rel="stylesheet" href="style.css">
  <script defer src="motion.js"></script>
</head>
<body>
  <main id="journey" aria-label="スクロールで建築の奥へ進むデモ">
    <div class="stage">
      <div class="scene" aria-hidden="true">
        <div class="courtyard plane" id="courtyard"><img src="assets/courtyard.webp" alt="" fetchpriority="high"></div>
        <div class="atmosphere" id="atmosphere"></div>
        <div class="destination" id="destination"><span>光の、その先へ。</span><h1>Stillness.</h1></div>
        <div class="portal plane" id="portal"><img src="assets/portal.webp" alt=""></div>
        <div class="between" id="between">INWARD</div>
        <div class="doorway plane" id="doorway"><img src="assets/doorway.webp" alt=""></div>
        <div class="shade"></div>
      </div>
      <header><a href="#journey" aria-label="最初へ戻る">INWARD<span>空間の余白</span></a><span class="edition">A STUDY IN DEPTH <small>v1</small></span></header>
      <div class="intro" id="intro"><p>その奥に、<br><em>ひらく。</em></p></div>
      <footer>
        <div class="caption"><span id="chapter">01 / THRESHOLD</span><span class="hint" id="hint">スクロールで奥へ ↓</span></div>
        <button id="replay" type="button" hidden>もう一度 ↺</button>
        <div class="track" role="progressbar" aria-label="空間の旅の進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div>
      </footer>
      <p class="error" id="error" hidden>画像を読み込めませんでした。<button type="button" onclick="location.reload()">再読み込み</button></p>
      <noscript><p class="error">この演出にはJavaScriptが必要です。</p></noscript>
    </div>
  </main>
</body>
</html>
